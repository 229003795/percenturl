<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Page Not Found | PercentURL</title>
<style>
:root{color-scheme:light;--bg:#f3f6fc;--panel:#fff;--ink:#10213b;--muted:#48617f;--line:#d7e2f2;--accent:#245cf0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
main{width:min(100%,680px);padding:clamp(24px,6vw,48px);border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:0 14px 42px rgba(16,33,59,.08)}
h1{margin:0 0 10px;font-size:clamp(2rem,7vw,3rem);line-height:1.1}
p{color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
a{display:inline-block;padding:10px 14px;border:1px solid var(--line);border-radius:10px;color:var(--accent);font-weight:650;text-decoration:none}
a:hover{border-color:var(--accent);text-decoration:underline}
</style>
</head>
<body>
<main>
<p><a href="/">PercentURL</a></p>
<h1>That page wasn’t found.</h1>
<p>The address may have changed or may contain a typo. Try a URL tool or return to the home page.</p>
<nav class="links" aria-label="Helpful pages">
<a href="/">Home and URL encoder</a>
<a href="/url-decoder/">URL decoder</a>
<a href="/url-encode-and-decode/">Encoding guide</a>
</nav>
</main>
<script src="/assets/analytics-consent.js" defer></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Hex bytes and literal text follow different paths</title><desc id="desc">Hex bytes E4 B8 AD are represented as %E4%B8%AD. Literal text E4B8AD stays E4B8AD.</desc><rect width="1000" height="420" rx="24" fill="#edf3ff"/><g font-family="system-ui,sans-serif" fill="#15243b"><text x="40" y="62" font-size="30" font-weight="700">Same-looking input. Different data.</text><rect x="35" y="100" width="930" height="120" rx="16" fill="white"/><rect x="35" y="245" width="930" height="120" rx="16" fill="white"/><text x="60" y="138" font-size="22" font-weight="650">HEX BYTES</text><text x="60" y="187" font-family="monospace" font-size="32">E4 B8 AD</text><text x="340" y="177" font-size="26">→ three bytes →</text><text x="640" y="177" font-family="monospace" font-size="32" fill="#2457d6">%E4%B8%AD</text><text x="60" y="283" font-size="22" font-weight="650">LITERAL TEXT</text><text x="60" y="332" font-family="monospace" font-size="32">E4B8AD</text><text x="340" y="322" font-size="26">→ six letters/digits →</text><text x="690" y="322" font-family="monospace" font-size="32" fill="#087f72">E4B8AD</text><text x="40" y="400" font-size="19">Choose the meaning first; then encode one URL component.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">A slash can separate path segments or belong to segment data</title>
<desc id="d">The first URL keeps route slashes literal and encodes spaces within segments. The second URL percent-encodes a slash that is data inside one opaque value.</desc>
<rect width="1200" height="560" rx="24" fill="#f7f9fd"/>
<text x="56" y="68" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#10213b">Decide what the slash means first</text>
<rect x="52" y="112" width="1096" height="170" rx="18" fill="#fff" stroke="#d7e2f2" stroke-width="2"/>
<text x="84" y="158" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#245cf0">ROUTE SEPARATOR</text>
<text x="84" y="216" font-family="monospace" font-size="25" fill="#10213b">/docs/design%20review/final</text>
<text x="84" y="251" font-family="Arial,sans-serif" font-size="17" fill="#48617f">Literal / marks the route; encode data inside each segment.</text>
<rect x="52" y="310" width="1096" height="190" rx="18" fill="#fff" stroke="#8ed4c7" stroke-width="2"/>
<text x="84" y="358" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#07866f">SLASH INSIDE ONE VALUE</text>
<text x="84" y="418" font-family="monospace" font-size="25" fill="#10213b">/files/folder%2Fa%20final.pdf</text>
<text x="84" y="459" font-family="Arial,sans-serif" font-size="17" fill="#48617f">%2F is data in one segment; the receiving server must allow it.</text>
</svg>

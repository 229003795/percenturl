<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">Three checks for an encoded slash URL error</title>
<desc id="d">Check the raw and encoded value, inspect which server layer first rejects or decodes it, and test the route safely before changing configuration.</desc>
<rect width="1200" height="560" rx="24" fill="#f7f9fd"/>
<text x="56" y="68" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#10213b">Debug one layer at a time</text>
<g font-family="Arial,sans-serif">
<rect x="52" y="125" width="1096" height="100" rx="18" fill="#fff" stroke="#d7e2f2" stroke-width="2"/>
<circle cx="112" cy="175" r="26" fill="#eaf0ff"/>
<text x="103" y="183" font-size="21" font-weight="700" fill="#245cf0">1</text>
<text x="164" y="166" font-size="20" font-weight="700" fill="#10213b">Compare raw value and one encoded segment</text>
<text x="164" y="198" font-size="16" fill="#48617f">Keep the original; do not add a second encoding layer as a guess.</text>
<rect x="52" y="245" width="1096" height="100" rx="18" fill="#fff" stroke="#d7e2f2" stroke-width="2"/>
<circle cx="112" cy="295" r="26" fill="#eaf0ff"/>
<text x="103" y="303" font-size="21" font-weight="700" fill="#245cf0">2</text>
<text x="164" y="286" font-size="20" font-weight="700" fill="#10213b">Find the first layer that rejects or changes %2F</text>
<text x="164" y="318" font-size="16" fill="#48617f">Check edge, proxy, web-server, and application logs in order.</text>
<rect x="52" y="365" width="1096" height="100" rx="18" fill="#fff" stroke="#8ed4c7" stroke-width="2"/>
<circle cx="112" cy="415" r="26" fill="#e6f7f3"/>
<text x="103" y="423" font-size="21" font-weight="700" fill="#07866f">3</text>
<text x="164" y="406" font-size="20" font-weight="700" fill="#10213b">Test in a safe environment; change only that layer</text>
<text x="164" y="438" font-size="16" fill="#48617f">Review security and route validation before allowing decoded slashes.</text>
</g>
</svg>

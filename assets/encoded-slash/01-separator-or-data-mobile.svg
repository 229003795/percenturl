<svg xmlns="http://www.w3.org/2000/svg" width="390" height="510" viewBox="0 0 390 510" role="img" aria-labelledby="t d">
<title id="t">A slash can be a route separator or value data</title>
<desc id="d">On mobile, two stacked examples show when slashes stay literal and when a slash inside one value becomes %2F.</desc>
<rect width="390" height="510" rx="18" fill="#f7f9fd"/>
<text x="18" y="39" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10213b">What does the slash mean?</text>
<rect x="14" y="65" width="362" height="184" rx="15" fill="#fff" stroke="#d7e2f2" stroke-width="2"/>
<text x="30" y="99" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#245cf0">ROUTE SEPARATOR</text>
<text x="30" y="144" font-family="monospace" font-size="17" fill="#10213b">/docs/design%20review/</text>
<text x="30" y="169" font-family="monospace" font-size="17" fill="#10213b">final</text>
<text x="30" y="210" font-family="Arial,sans-serif" font-size="14" fill="#48617f">Keep route slashes; encode segment data.</text>
<rect x="14" y="268" width="362" height="218" rx="15" fill="#fff" stroke="#8ed4c7" stroke-width="2"/>
<text x="30" y="303" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#07866f">SLASH INSIDE ONE VALUE</text>
<text x="30" y="350" font-family="monospace" font-size="17" fill="#10213b">/files/folder%2Fa%20</text>
<text x="30" y="375" font-family="monospace" font-size="17" fill="#10213b">final.pdf</text>
<text x="30" y="423" font-family="Arial,sans-serif" font-size="14" fill="#48617f">The server must accept encoded slashes.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Encode one URL value, then assemble the URL</title><desc id="desc">A diagram showing query parameter separators left structural while data values are percent encoded.</desc>
<rect width="1200" height="630" rx="28" fill="#f3f7ff"/><text x="70" y="78" fill="#172a4a" font-family="Arial,sans-serif" font-size="38" font-weight="700">Encode the value. Keep URL structure.</text><text x="70" y="121" fill="#64748b" font-family="Arial,sans-serif" font-size="20">Build the link after encoding its data</text>
<rect x="70" y="165" width="460" height="178" rx="18" fill="#fff" stroke="#d6e2f2" stroke-width="2"/><text x="100" y="210" fill="#64748b" font-family="Arial,sans-serif" font-size="18" font-weight="700">1 · VALUE</text><text x="100" y="266" fill="#172a4a" font-family="Arial,sans-serif" font-size="28">red shoes &amp; socks</text><text x="100" y="310" fill="#64748b" font-family="Arial,sans-serif" font-size="18">Encode only this text</text>
<path d="M560 252h72m-18-18 18 18-18 18" fill="none" stroke="#3584e4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="670" y="165" width="460" height="178" rx="18" fill="#fff" stroke="#d6e2f2" stroke-width="2"/><text x="700" y="210" fill="#64748b" font-family="Arial,sans-serif" font-size="18" font-weight="700">2 · ENCODED VALUE</text><text x="700" y="266" fill="#1261b0" font-family="Arial,sans-serif" font-size="25" font-weight="700">red%20shoes%20%26%20socks</text><text x="700" y="310" fill="#64748b" font-family="Arial,sans-serif" font-size="18">The ampersand inside data becomes %26</text>
<rect x="70" y="390" width="1060" height="155" rx="18" fill="#e5eefb"/><text x="100" y="434" fill="#64748b" font-family="Arial,sans-serif" font-size="18" font-weight="700">3 · ASSEMBLE THE LINK</text><text x="100" y="493" fill="#172a4a" font-family="Consolas,monospace" font-size="26">https://example.com/search?q=red%20shoes%20%26%20socks</text><text x="100" y="526" fill="#1261b0" font-family="Arial,sans-serif" font-size="17">?, =, and the parameter separators stay in their structural positions.</text></svg>

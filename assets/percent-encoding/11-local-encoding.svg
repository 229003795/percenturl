<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Browser-local URL encoding keeps text on your device</title><desc id="desc">A diagram showing text encoded locally in the browser without uploading the value.</desc>
<rect width="1200" height="630" rx="28" fill="#f3f7ff"/><text x="70" y="78" fill="#172a4a" font-family="Arial,sans-serif" font-size="38" font-weight="700">Encode locally in your browser</text><text x="70" y="121" fill="#64748b" font-family="Arial,sans-serif" font-size="20">No upload and no server round trip for the text you encode</text>
<rect x="70" y="176" width="1060" height="335" rx="22" fill="#fff" stroke="#d6e2f2" stroke-width="2"/>
<rect x="115" y="225" width="260" height="236" rx="18" fill="#eef5ff"/><rect x="180" y="255" width="130" height="112" rx="12" fill="#fff" stroke="#98b7df" stroke-width="3"/><rect x="198" y="275" width="94" height="14" rx="7" fill="#bad0ed"/><rect x="198" y="302" width="68" height="14" rx="7" fill="#bad0ed"/><path d="M174 397h142l-18 22h-106z" fill="#8bb0df"/><text x="143" y="446" fill="#172a4a" font-family="Arial,sans-serif" font-size="18" font-weight="700">Your browser</text>
<path d="M410 339h142m-22-22 22 22-22 22" fill="none" stroke="#20a177" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="578" y="225" width="245" height="236" rx="18" fill="#e9f8f1"/><circle cx="700" cy="300" r="40" fill="#c4eedc"/><path d="M700 276v48m-18-18h36" stroke="#16835f" stroke-width="8" stroke-linecap="round"/><text x="626" y="383" fill="#126b50" font-family="Arial,sans-serif" font-size="20" font-weight="700">Encode on device</text><text x="635" y="415" fill="#64748b" font-family="Arial,sans-serif" font-size="16">Text stays in the tab</text>
<path d="M858 339h90" fill="none" stroke="#c5d1df" stroke-width="6" stroke-dasharray="12 12"/><circle cx="1010" cy="340" r="57" fill="#f4f6f9" stroke="#d7dee8" stroke-width="3"/><path d="M987 340h46m-23-23v46" stroke="#a0acba" stroke-width="6" stroke-linecap="round"/><text x="973" y="426" fill="#64748b" font-family="Arial,sans-serif" font-size="17" font-weight="700">No text upload</text><text x="318" y="555" fill="#126b50" font-family="Arial,sans-serif" font-size="19" font-weight="700">Input → local encoding → result · the value does not need to leave your device</text></svg>
